# ============================================================================
# CI CoachRun — backend (verify + smoke test Liquibase/PostgreSQL) & frontend.
# ============================================================================
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Backend : build + tests (Liquibase sur H2) puis smoke test de démarrage
  # contre un PostgreSQL éphémère (valide les migrations via /actuator/health).
  # --------------------------------------------------------------------------
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        # Aligné sur la version de production (Railway) : le smoke test ne vaut que
        # s'il rejoue les migrations sur le même major que la prod.
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coachrun
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test (Liquibase sur H2)
        run: mvn -B -ntp clean verify

      # Le profil prod active StartupSecretsValidator, qui refuse de démarrer sur une
      # configuration incomplète. Les valeurs ci-dessous sont donc contraintes : `FRONTEND_URL` et
      # `CORS_ORIGINS` ne peuvent pas pointer sur localhost (des liens d'invitation en localhost
      # n'ouvrent rien), les clés VAPID sont exigées (« séance planifiée » et « commentaire du
      # coach » n'ont plus de repli e-mail sans elles), et le mode « invite » — défaut du profil
      # prod — impose un code.
      #
      # Ces règles ont été ajoutées sans que ce fichier suive : le smoke test ne démarrait donc
      # plus, et le job échouait après 40 tentatives. C'est exactement ce que ce test est censé
      # attraper — un backend qui refuse de booter en configuration de production — et il le
      # signalait sur sa propre configuration, pas sur le code.
      - name: Smoke test démarrage (PostgreSQL éphémère + Liquibase)
        env:
          SPRING_PROFILES_ACTIVE: prod
          JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/coachrun
          PGUSER: postgres
          PGPASSWORD: postgres
          JWT_SECRET: ci-smoke-test-secret-not-for-production-rotate-me-aaaaaaaaaaaaaaaa
          FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGINS: https://ci.invalid
          FRONTEND_URL: https://ci.invalid
          # Valeurs factices : le smoke test vérifie que l'application démarre et migre, il
          # n'envoie aucune notification. `.invalid` est un TLD réservé (RFC 2606) — rien ne
          # peut être joint par erreur.
          VAPID_PUBLIC_KEY: ci-smoke-test-public-key
          VAPID_PRIVATE_KEY: ci-smoke-test-private-key
          REGISTRATION_INVITE_CODE: ci-smoke-test
          # Topologie de CI : aucun proxy devant l'application (le validateur exige ≥ 2 pour la
          # chaîne Vercel → Railway ; ici on ne teste pas le rate limiting, on satisfait la règle).
          RATE_LIMIT_TRUSTED_PROXY_HOPS: "2"
        run: |
          java -jar target/coachrun-back.jar &
          APP_PID=$!
          echo "Attente du démarrage (migrations Liquibase sur PostgreSQL)…"
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ /api/actuator/health = UP"
              curl -fsS http://localhost:8080/api/public/ping
              kill "$APP_PID"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Le backend n'est pas devenu sain à temps."
          kill "$APP_PID" || true
          exit 1

  # --------------------------------------------------------------------------
  # Frontend : install + build de production (typecheck AOT).
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Build (production, AOT)
        run: npm run build

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Tests unitaires (Karma headless)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test
