# ============================================================================
# Sauvegarde quotidienne PostgreSQL (production Railway) — externalisée.
#
#   pg_dump -Fc → vérification d'intégrité → chiffrement AES-256 → artefact
#   GitHub (rétention 14 jours). Les dumps sont ainsi stockés HORS de
#   l'infrastructure Railway (un incident côté hébergeur ne les emporte pas).
#
# Secrets à configurer (Settings → Secrets and variables → Actions) :
#   BACKUP_DATABASE_URL    URL publique de connexion PostgreSQL
#                          (Railway → PostgreSQL → Connect → « Public Network »)
#   BACKUP_ENCRYPTION_KEY  passphrase de chiffrement — openssl rand -hex 32
#                          ⚠️ à conserver AUSSI hors de GitHub (gestionnaire de
#                          mots de passe) : sans elle, les dumps sont illisibles.
#   BACKUP_HEARTBEAT_URL   (optionnel) URL de heartbeat Better Stack, pingée
#                          uniquement en cas de succès → alerte si le job s'arrête.
#
# Restauration : cf. docs/OPERATIONS.md §2 (déchiffrement puis pg_restore).
# NB : GitHub désactive les crons d'un dépôt inactif > 60 jours ; le job
# échoue bruyamment (email GitHub) si un secret manque ou si le dump échoue.
# ============================================================================
name: Sauvegarde BDD

on:
  schedule:
    - cron: "30 2 * * *" # quotidien, 02:30 UTC
  workflow_dispatch: # lancement manuel (premier test, avant un déploiement…)

jobs:
  backup:
    name: pg_dump chiffré → artefact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier la présence des secrets
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::Secret BACKUP_DATABASE_URL manquant."; exit 1; }
          [ -n "$ENC_KEY" ] || { echo "::error::Secret BACKUP_ENCRYPTION_KEY manquant."; exit 1; }

      # Le client doit être >= au serveur (Railway est en PG 18) : les dépôts Ubuntu
      # s'arrêtent à la 16, on passe donc par le dépôt officiel PGDG.
      - name: Installer le client PostgreSQL 18 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # /usr/bin/pg_dump est un wrapper postgresql-common qui résout vers le
          # client 16 préinstallé sur le runner : on met les binaires 18 en tête de PATH.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Vérifier la version du client
        run: |
          pg_dump --version
          # Échouer ici plutôt qu'au dump : un client trop ancien = pas de sauvegarde.
          pg_dump --version | grep -qE ' 18(\.|$)' \
            || { echo "::error::Client PostgreSQL != 18 ($(pg_dump --version))"; exit 1; }

      - name: Dump (format custom) + vérification d'intégrité
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          TS="$(date -u +%Y%m%d-%H%M%S)"
          echo "OUT=darilab-${TS}.dump" >> "$GITHUB_ENV"
          pg_dump --format=custom --no-owner --no-privileges \
            --file="darilab-${TS}.dump" "$DATABASE_URL"
          # Un dump illisible ne doit jamais devenir « la » sauvegarde du jour.
          pg_restore --list "darilab-${TS}.dump" > /dev/null
          du -h "darilab-${TS}.dump"

      - name: Chiffrer (AES-256, PBKDF2)
        env:
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$OUT" -out "$OUT.enc" -pass env:ENC_KEY
          rm -f "$OUT"

      - name: Publier l'artefact (rétention 14 jours)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUT }}.enc
          path: ${{ env.OUT }}.enc
          retention-days: 14
          if-no-files-found: error

      # Dead man's switch : ce ping n'a lieu QUE si toutes les étapes précédentes ont
      # réussi (comportement par défaut des steps). Si la sauvegarde cesse de tourner —
      # secret expiré, base injoignable, cron GitHub désactivé après 60 jours
      # d'inactivité — Better Stack n'est plus pingué et alerte après la grace period.
      - name: Signaler le succès (heartbeat Better Stack)
        env:
          HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "::warning::BACKUP_HEARTBEAT_URL absent — aucune supervision du job."
            exit 0
          fi
          curl -fsS --retry 3 --max-time 20 "$HEARTBEAT_URL" > /dev/null
          echo "✅ Heartbeat envoyé."
