<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Darilab — Coaching course à pied</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Darilab : plateforme de coaching course à pied. Plans, séances structurées, suivi de la charge et espace athlète mobile.">

  <!-- Polices auto-hébergées : préchargées pour que le premier écran n'attende plus une
       requête vers un tiers. Seuls les sous-ensembles latin des deux familles vues au premier
       rendu (UI + display) sont préchargés ; le reste se charge à la demande via unicode-range. -->
  <link rel="preload" href="assets/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Open Graph / Twitter Card : sans eux, un lien partagé (WhatsApp, Slack, LinkedIn)
       n'affiche qu'une URL nue. L'image fait 1200×630, le ratio attendu par les plateformes. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Darilab">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://www.darilab.app/">
  <meta property="og:title" content="Darilab — Le coaching course à pied, prescrit et vérifié">
  <meta property="og:description" content="Trouve ton coach de course à pied dans l'annuaire, ou accompagne tes athlètes : plans structurés, suivi du réalisé et de la charge, espace athlète mobile.">
  <meta property="og:image" content="https://www.darilab.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Darilab — trouve ton coach de course à pied, ou tes prochains athlètes">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Darilab — Le coaching course à pied, prescrit et vérifié">
  <meta name="twitter:description" content="Trouve ton coach de course à pied dans l'annuaire, ou accompagne tes athlètes.">
  <meta name="twitter:image" content="https://www.darilab.app/assets/og-image.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e6e78">

  <!-- iOS / Apple -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Barre d'état OPAQUE (« default »), plus « black-translucent ». Depuis iOS 26.1, une app
       installée en black-translucent ne dessine plus sous la barre d'état : iOS peint par-dessus
       un dégradé flou qui déborde sur le haut de la page (logo, cloche, avatar flous et difficiles
       à toucher) et la page est mise en page trop courte d'une hauteur de barre en bas. En mode
       opaque, la page commence sous la barre d'état et env(safe-area-inset-top) vaut 0 : les
       retraits max(…, env(safe-area-inset-top)) déjà en place restent justes. Une app déjà
       installée doit être supprimée puis réinstallée pour prendre en compte ce changement. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Darilab">
</head>
<body>
  <app-root></app-root>
  <noscript>Veuillez activer JavaScript pour utiliser Darilab.</noscript>
</body>
</html>
