<!doctype html>
<!--
  Vidéo de présentation pour les coachs (1920×1080, ~73 s). Source de la vidéo :
    node branding/video/render-video.mjs
  Chaque image est calculée par render(t) : pas d'animation CSS, donc un rendu image par image
  exact et reproductible. Les écrans viennent de docs/captures (script e2e/captures).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Archivo'; src: url('../../src/assets/fonts/archivo-latin.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('../../src/assets/fonts/ibm-plex-sans-latin.woff2') format('woff2'); font-weight: 100 700; }
  html, body { margin: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden; position: relative;
    background:
      radial-gradient(60% 70% at 12% 0%, rgba(18, 133, 145, 0.32) 0%, transparent 60%),
      radial-gradient(55% 70% at 100% 100%, rgba(47, 179, 192, 0.26) 0%, transparent 62%),
      linear-gradient(165deg, #0f2125 0%, #081316 78%);
    color: #eef6f6; font-family: 'IBM Plex Sans', sans-serif;
  }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .caption { position: absolute; left: 110px; top: 0; bottom: 0; width: 520px;
    display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #2fb3c0; margin-bottom: 22px; }
  .title { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.08;
    letter-spacing: -0.02em; }
  .title em { font-style: normal; background: linear-gradient(120deg, #8fdbe3 0%, #2fb3c0 55%, #6ee7d0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 27px; line-height: 1.4; color: rgba(238, 246, 246, 0.72); }
  .window { position: absolute; left: 700px; top: 160px; width: 1136px; height: 760px; border-radius: 18px;
    overflow: hidden; background: #fff; box-shadow: 0 40px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08); }
  .window .bar { height: 40px; background: #eef1f2; display: flex; align-items: center; gap: 9px; padding-left: 18px; }
  .window .bar i { width: 13px; height: 13px; border-radius: 50%; background: #d3d8da; display: block; }
  .window .bar span { margin-left: 22px; font-size: 15px; color: #6b7a7d; background: #fff; border-radius: 8px; padding: 4px 18px; }
  .window .view { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .window img { position: absolute; left: 0; top: 0; width: 1136px; transform-origin: 0 0; }
  .window img.layer2 { opacity: 0; }
  .phone { position: absolute; width: 330px; height: 714px; border-radius: 44px; background: #000; padding: 12px;
    box-sizing: border-box; box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.10); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 33px; display: block; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 30px; }
  .brand svg { width: 130px; height: 130px; }
  .word { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 92px; letter-spacing: -0.02em; }
  .word span { color: #2fb3c0; }
  .big { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 76px; line-height: 1.08; letter-spacing: -0.025em; max-width: 1400px; }
  .big em { font-style: normal; background: linear-gradient(120deg, #8fdbe3 0%, #2fb3c0 55%, #6ee7d0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cta { margin-top: 56px; display: inline-block; background: #128591; color: #fff; font-family: 'Archivo', sans-serif;
    font-weight: 700; font-size: 38px; padding: 26px 56px; border-radius: 18px; box-shadow: 0 20px 60px rgba(18,133,145,0.45); }
  .url { margin-top: 34px; font-size: 34px; color: rgba(238,246,246,0.8); letter-spacing: 0.02em; }
  .zones { display: flex; gap: 12px; margin-top: 48px; }
  .zones i { display: block; width: 60px; height: 16px; border-radius: 8px; }
  .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #128591, #2fb3c0); }
</style>
</head>
<body>
<script>
const LOGO = `<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#12808B"/><stop offset="1" stop-color="#0A4F58"/></linearGradient></defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <path d="M250 720 C 420 700, 540 580, 770 360" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" fill="none"/>
  <path d="M250 560 L 360 560" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" opacity="0.55"/>
  <path d="M250 640 L 320 640" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" opacity="0.35"/>
  <circle cx="788" cy="338" r="86" fill="#16C47F"/><circle cx="788" cy="338" r="86" stroke="#FFFFFF" stroke-width="22" fill="none"/></svg>`;
const BRAND = `<div class="brand">${LOGO}<span class="word">Dari<span>lab</span></span></div>`;
const CAP = '../../../docs/captures/';
const ZONES = `<div class="zones"><i style="background:#7c8aa5"></i><i style="background:#16c47f"></i><i style="background:#f2b807"></i><i style="background:#ff8a1e"></i><i style="background:#ef4444"></i></div>`;

/*
 * Les scènes. `zoom` : [échelle, x, y] de départ et d'arrivée, x et y en fraction de l'image
 * (le point de l'image placé dans le coin haut-gauche de la fenêtre).
 */
const SCENES = [
  { dur: 4.5, html: `<div class="center"><div data-in="0.2">${BRAND}</div>
      <div class="big" style="margin-top:60px" data-in="1.2">Le coaching de course à pied,<br><em>dans un seul outil.</em></div></div>` },
  { dur: 6.5, kicker: 'Votre journée', title: 'Voyez d’un coup d’œil <em>qui a besoin de vous.</em>',
    sub: 'Fatigue, douleur, silence : les athlètes à surveiller remontent seuls.',
    img: 'ordinateur/10-tableau-de-bord.jpg', url: 'darilab.app/app', zoom: [[1, 0, 0], [1.55, 0.08, 0.1]] },
  { dur: 6.5, kicker: 'Les retours', title: 'Chaque séance faite, <em>notée par l’athlète.</em>',
    sub: 'Effort, fatigue, douleur, un mot pour vous. Répondez ou dites « vu » d’un clic.',
    img: 'ordinateur/11-ma-journee.jpg', url: 'darilab.app/app/journee', zoom: [[1.25, 0.1, 0], [1.25, 0.1, 0.16]] },
  { dur: 7.5, kicker: 'La planification', title: 'Glissez vos séances types <em>sur le calendrier.</em>',
    sub: 'Copiez une semaine, un athlète, un groupe. Les allures se recalculent pour chacun.',
    img: 'ordinateur/14-programme-athlete.jpg', url: 'darilab.app/app/athletes/…/programme', zoom: [[1, 0, 0], [1.35, 0.26, 0.2]] },
  { dur: 6.5, kicker: 'La physiologie', title: 'Des allures <em>calculées pour chaque athlète.</em>',
    sub: 'VDOT, seuils, vitesse critique : vos séances se prescrivent en fourchettes.',
    img: 'ordinateur/13-fiche-athlete.jpg', url: 'darilab.app/app/athletes/…', zoom: [[1, 0, 0], [1.5, 0.08, 0.22]] },
  { dur: 6, kicker: 'La charge', title: 'Voyez venir la fatigue <em>avant la blessure.</em>',
    sub: 'Douze semaines de charge et le ratio aigu / chronique, sans tableur.',
    img: 'ordinateur/15-charge-athlete.jpg', url: 'darilab.app/app/athletes/…/load', zoom: [[1, 0, 0], [1.3, 0.22, 0.22]] },
  { dur: 7.5, kicker: 'Côté athlète', title: 'Tout est <em>sur son téléphone.</em>',
    sub: 'Sa séance du jour, son mois, ses messages. Son retour en trente secondes.',
    phones: ['telephone/01-aujourdhui.jpg', 'telephone/02-calendrier.jpg', 'telephone/03-messages.jpg'] },
  { dur: 6.5, kicker: 'La messagerie', title: 'Une conversation <em>par athlète.</em>',
    sub: 'Plus un fil par groupe et un pour le club. Fini les messages perdus.',
    img: 'ordinateur/18-messages.jpg', url: 'darilab.app/app/messages', zoom: [[1, 0, 0], [1.4, 0.3, 0.06]] },
  { dur: 8.5, kicker: 'L’annuaire', title: 'Et de nouveaux athlètes <em>viennent à vous.</em>',
    sub: 'Votre fiche publique : approche, spécialités, tarifs, diplômes.',
    img: 'ordinateur/02-annuaire.jpg', img2: 'ordinateur/03-fiche-publique.jpg', url: 'darilab.app/coachs',
    zoom: [[1, 0, 0], [1.15, 0.02, 0.04]] },
  { dur: 6, kicker: 'Les demandes', title: 'Une demande arrive ? <em>Acceptez en un clic.</em>',
    sub: 'Vos coordonnées restent privées : tout passe par la demande.',
    img: 'ordinateur/20-demandes.jpg', url: 'darilab.app/app/demandes', zoom: [[1, 0, 0], [1.2, 0.15, 0.08]] },
  { dur: 7, html: `<div class="center"><div data-in="0.2">${BRAND}</div>
      <div class="big" style="margin-top:56px" data-in="0.8">Créez votre espace coach,<br><em>gratuitement.</em></div>
      <div data-in="1.6"><div class="cta">Créer mon espace</div></div>
      <div class="url" data-in="2.0">darilab.app</div><div data-in="2.4">${ZONES}</div></div>` },
];

let at = 0;
for (const s of SCENES) {
  s.start = at; at += s.dur;
  const el = document.createElement('div');
  el.className = 'scene';
  if (s.html) {
    el.innerHTML = s.html;
  } else {
    el.innerHTML = `<div class="caption"><div class="kicker" data-in="0.15">${s.kicker}</div>
      <div class="title" data-in="0.3">${s.title}</div><div class="sub" data-in="0.6">${s.sub}</div></div>`;
    if (s.img) {
      el.insertAdjacentHTML('beforeend', `<div class="window" data-in="0.1" data-from="60"><div class="bar"><i></i><i></i><i></i><span>${s.url}</span></div>
        <div class="view"><img class="layer1" src="${CAP + s.img}">${s.img2 ? `<img class="layer2" src="${CAP + s.img2}">` : ''}</div></div>`);
    }
    if (s.phones) {
      s.phones.forEach((p, i) => el.insertAdjacentHTML('beforeend',
        `<div class="phone" data-in="${0.2 + i * 0.35}" data-from="140" style="left:${730 + i * 370}px; top:${190 + (i === 1 ? -30 : 20)}px"><img src="${CAP + p}"></div>`));
    }
  }
  document.body.appendChild(el);
  s.el = el;
}
const bar = document.createElement('div'); bar.className = 'progress'; document.body.appendChild(bar);
window.DURATION = at;

const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const easeOut = (v) => 1 - Math.pow(1 - v, 3);
const FADE = 0.45;

window.render = function (t) {
  for (const s of SCENES) {
    const local = t - s.start;
    if (local < -FADE || local > s.dur + FADE) { s.el.style.opacity = 0; continue; }
    // Fondu enchaîné : la scène entre pendant que la précédente sort.
    const fadeIn = s.start === 0 ? 1 : clamp((local + FADE) / (2 * FADE));
    const fadeOut = s === SCENES[SCENES.length - 1] ? 1 : clamp((s.dur + FADE - local) / (2 * FADE));
    s.el.style.opacity = Math.min(fadeIn, fadeOut);
    // Entrées décalées : glissé vers le haut (ou depuis la droite pour les écrans).
    s.el.querySelectorAll('[data-in]').forEach((e) => {
      const p = easeOut(clamp((local - parseFloat(e.dataset.in)) / 0.7));
      const from = parseFloat(e.dataset.from || '40');
      e.style.opacity = p;
      e.style.transform = e.classList.contains('window') || e.classList.contains('phone')
        ? `translateX(${(1 - p) * from}px)` : `translateY(${(1 - p) * from}px)`;
    });
    if (s.zoom) {
      const img = s.el.querySelector('img.layer1');
      const view = s.el.querySelector('.view');
      const p = ease(clamp((local - 0.9) / (s.dur - 1.6)));
      const [a, b] = s.zoom;
      const sc = a[0] + (b[0] - a[0]) * p, x = a[1] + (b[1] - a[1]) * p, y = a[2] + (b[2] - a[2]) * p;
      const w = img.clientWidth, h = img.clientHeight;
      const tf = `translate(${-x * w * sc}px, ${-y * h * sc}px) scale(${sc})`;
      img.style.transform = tf;
      const img2 = s.el.querySelector('img.layer2');
      if (img2) {
        // L'annuaire, puis la fiche d'une coach : bascule à mi-scène.
        const q = clamp((local - s.dur * 0.5) / 0.5);
        img2.style.opacity = q;
        const z = 1 + 0.12 * ease(clamp((local - s.dur * 0.5) / (s.dur * 0.5)));
        img2.style.transform = `scale(${z})`;
      }
      void view;
    }
  }
  bar.style.width = `${(t / window.DURATION) * 100}%`;
};
render(0);
</script>
</body>
</html>
