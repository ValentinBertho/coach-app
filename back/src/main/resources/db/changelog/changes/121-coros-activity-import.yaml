# ============================================================================
# 121 — Les sorties COROS vues par l'import.
#
#   Une ligne par sortie listée chez COROS (querySportRecords) : ce qu'on en a
#   fait (importée, fusionnée avec la même sortie venue de Strava ou Garmin,
#   écartée, en échec) et quand son fichier FIT a été téléchargé.
#
#   COROS limite les téléchargements FIT à 50 par utilisateur et par 24 h :
#   downloaded_at sert à tenir ce quota, et une sortie déjà traitée n'est
#   jamais retéléchargée.
#
#   activity_id est NULLABLE, ON DELETE SET NULL : si l'athlète supprime la
#   sortie, la ligne reste et empêche de la réimporter.
# ============================================================================
databaseChangeLog:
  - changeSet:
      id: 121-coros-activity-import
      author: coachrun
      changes:
        - createTable:
            tableName: coros_activity_imports
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: athlete_id, type: UUID, constraints: { nullable: false } }
              - column: { name: label_id, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: sport_type, type: INTEGER }
              - column: { name: activity_date, type: DATE }
              - column: { name: outcome, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: activity_id, type: UUID }
              - column: { name: attempts, type: INTEGER, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: downloaded_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: last_error, type: VARCHAR(500) }
        - addUniqueConstraint:
            tableName: coros_activity_imports
            constraintName: uq_coros_activity_imports_label
            columnNames: athlete_id, label_id
        - addForeignKeyConstraint:
            constraintName: fk_coros_activity_imports_athlete
            baseTableName: coros_activity_imports
            baseColumnNames: athlete_id
            referencedTableName: athletes
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_coros_activity_imports_activity
            baseTableName: coros_activity_imports
            baseColumnNames: activity_id
            referencedTableName: activities
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            tableName: coros_activity_imports
            indexName: idx_coros_activity_imports_activity
            columns:
              - column: { name: activity_id }
