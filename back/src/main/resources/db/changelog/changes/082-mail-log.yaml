# ============================================================================
# 082 — Journal des e-mails sortants.
#   Le produit s'appuie sur un plafond d'envoi (quelques milliers par mois, cent
#   par jour) que rien ne mesurait : la seule façon de connaître sa consommation
#   était d'ouvrir la console du fournisseur, et la seule façon d'apprendre qu'on
#   avait dépassé le plafond était qu'un coach signale n'avoir jamais reçu son
#   lien de réinitialisation — précisément l'envoi qu'on ne peut pas perdre.
#
#   La table ne porte ni corps d'e-mail ni donnée de santé : destinataire, sujet,
#   nature, issue. L'adresse étant une donnée personnelle, les lignes sont purgées
#   au-delà de app.mail.log-retention-days (180 jours par défaut).
#
#   Additif : nouvelle table, aucune donnée existante touchée.
# ============================================================================
databaseChangeLog:
  - changeSet:
      id: 082-mail-log
      author: coachrun
      changes:
        - createTable:
            tableName: mail_log
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: recipient, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: subject, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: kind, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: audience, type: VARCHAR(16) }
              - column: { name: sent, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: error_message, type: VARCHAR(500) }
              - column: { name: sent_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }

        # Toutes les lectures de l'écran d'administration sont bornées dans le temps
        # (aujourd'hui, ce mois, les 30 derniers jours) et triées du plus récent au plus ancien.
        - createIndex:
            tableName: mail_log
            indexName: idx_mail_log_sent_at
            columns:
              - column: { name: sent_at, descending: true }
