# ============================================================================
# 120 — Les séances envoyées dans le calendrier COROS d'un athlète.
#
#   Une ligne par séance Darilab déposée chez COROS (COROS MCP) : son
#   identifiant là-bas (idInPlan), sa date et l'empreinte du contenu envoyé.
#
#   COROS ne permet ni de supprimer ni de déplacer une séance : une séance
#   retirée ici est réécrite là-bas en « Annulée par ton coach » (cancelled),
#   et la ligne reste jusqu'à sa date.
#
#   workout_id est NULLABLE, ON DELETE SET NULL : quand le coach supprime une
#   séance, la ligne doit survivre — c'est elle qui dit quoi annuler sur la
#   montre à la passe suivante.
# ============================================================================
databaseChangeLog:
  - changeSet:
      id: 120-coros-workout-sync
      author: coachrun
      changes:
        - createTable:
            tableName: coros_workout_syncs
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: athlete_id, type: UUID, constraints: { nullable: false } }
              - column: { name: workout_id, type: UUID }
              - column: { name: scheduled_date, type: DATE, constraints: { nullable: false } }
              - column: { name: id_in_plan, type: VARCHAR(64) }
              - column: { name: content_hash, type: VARCHAR(64) }
              - column: { name: cancelled, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: title, type: VARCHAR(120) }
              - column: { name: last_error, type: VARCHAR(500) }
        - addForeignKeyConstraint:
            constraintName: fk_coros_workout_syncs_athlete
            baseTableName: coros_workout_syncs
            baseColumnNames: athlete_id
            referencedTableName: athletes
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_coros_workout_syncs_workout
            baseTableName: coros_workout_syncs
            baseColumnNames: workout_id
            referencedTableName: workouts
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            tableName: coros_workout_syncs
            indexName: idx_coros_workout_syncs_athlete
            columns:
              - column: { name: athlete_id }
        - createIndex:
            tableName: coros_workout_syncs
            indexName: idx_coros_workout_syncs_workout
            columns:
              - column: { name: workout_id }
