# ============================================================================
# 063 — Date du dernier changement de mot de passe.
#   Un reset ou un changement de mot de passe ne révoquait aucune session : les
#   refresh tokens (TTL 30 j) déjà émis restaient valables, y compris celui de
#   l'attaquant que le changement était censé chasser. Tout jeton émis avant
#   cette date est désormais rejeté.
#   Nulle pour les comptes existants = aucun jeton invalidé rétroactivement.
# ============================================================================
databaseChangeLog:
  - changeSet:
      id: 063-user-password-changed-at
      author: coachrun
      changes:
        - addColumn:
            tableName: users
            columns:
              - column: { name: password_changed_at, type: TIMESTAMP }
