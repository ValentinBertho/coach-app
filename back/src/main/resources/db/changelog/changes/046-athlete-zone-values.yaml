# ============================================================================
# 046 — Valeurs de zones par athlète (fourchette min/max par métrique).
#   Table additive, non destructive. La fiche athlète devient la source de vérité des cibles
#   (façon Nolio) ; les valeurs AUTO sont pré-remplies depuis le moteur physio existant
#   (ZoneValueSyncService), les valeurs MANUAL/verrouillées sont préservées au resync.
#   Cf. docs/AUDIT-COACH-ZONES-METRIQUES.md §3.1-3.2 (chantier Z2).
# ============================================================================
databaseChangeLog:
  - changeSet:
      id: 046-create-athlete-zone-values
      author: coachrun
      changes:
        - createTable:
            tableName: athlete_zone_values
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: athlete_id, type: UUID, constraints: { nullable: false } }
              - column: { name: zone_id, type: UUID, constraints: { nullable: false } }
              - column: { name: metric_type_id, type: UUID, constraints: { nullable: false } }
              - column: { name: value_min, type: DOUBLE }
              - column: { name: value_max, type: DOUBLE }
              - column: { name: source, type: VARCHAR(16), defaultValue: AUTO, constraints: { nullable: false } }
              - column: { name: locked, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_azv_athlete
            baseTableName: athlete_zone_values
            baseColumnNames: athlete_id
            referencedTableName: athletes
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_azv_zone
            baseTableName: athlete_zone_values
            baseColumnNames: zone_id
            referencedTableName: training_zones
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_azv_metric
            baseTableName: athlete_zone_values
            baseColumnNames: metric_type_id
            referencedTableName: metric_types
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uk_athlete_zone_metric
            tableName: athlete_zone_values
            columnNames: athlete_id, zone_id, metric_type_id
        - createIndex:
            indexName: idx_azv_athlete
            tableName: athlete_zone_values
            columns:
              - column: { name: athlete_id }
