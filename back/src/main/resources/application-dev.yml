# ============================================================================
# Profil dev — développement local (Docker Desktop ou Postgres local).
# Secrets de dev par défaut acceptés ; seed possible.
#
# Le SQL n'est PLUS journalisé par défaut. Il l'était, et c'était de loin la première source de
# bruit : une seule ouverture d'écran produit des dizaines de requêtes, si bien que la ligne qu'on
# cherche — un refus d'authentification, un rappel parti — se noyait dans le détail des requêtes.
# Il reste à un interrupteur près : LOG_LEVEL_SQL=DEBUG le temps d'une session de mise au point.
# ============================================================================
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.coachrun: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAMS:WARN}

app:
  seed:
    enabled: true   # jeu de données de démo au démarrage
  vapid:
    # Sans clés, le push est inerte : le navigateur ne peut même pas s'abonner, faute de clé
    # publique de serveur. En local, on en fabrique donc une paire au premier démarrage, conservée
    # dans back/.vapid-dev.json — un abonnement de navigateur étant lié à la clé publique avec
    # laquelle il a été créé, une paire qui changerait à chaque redémarrage couperait les
    # notifications sans rien dire. La production, elle, exige des clés explicites : on ne fabrique
    # pas en silence une identité de serveur qui changerait au prochain déploiement.
    auto-generate: ${VAPID_AUTO_GENERATE:true}
