# ============================================================================
# Profil prod — secrets OBLIGATOIRES (cf. StartupSecretsValidator).
# L'application refuse de démarrer si JWT_SECRET / FIELD_ENCRYPTION_KEY sont
# absents ou laissés à leurs valeurs de développement.
# ============================================================================
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

# Réglable sans redéploiement : poser LOG_LEVEL_APP=DEBUG le temps d'une mise au point, puis
# retirer la variable. Le SQL reste à part — c'est le plus volumineux, et on ne l'allume que
# lorsqu'on cherche précisément une requête.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.coachrun: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAMS:WARN}

# Swagger/OpenAPI fermé en production : la spec expose toute la surface de l'API
# (routes, paramètres, schémas) à un visiteur anonyme. Réactivable ponctuellement
# via SWAGGER_ENABLED=true (puis remettre à false).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  seed:
    enabled: false
  registration:
    # Bêta sur invitation : le runbook prévoit une cohorte de 5 à 8 coachs, mais /auth/register
    # était public et n'exigeait que l'unicité de l'e-mail — n'importe qui pouvait créer un club.
    # Passer à « open » le jour de l'ouverture publique.
    mode: ${REGISTRATION_MODE:invite}
