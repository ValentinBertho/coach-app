# ============================================================================
# Profil prod — secrets OBLIGATOIRES (cf. StartupSecretsValidator).
# L'application refuse de démarrer si JWT_SECRET / FIELD_ENCRYPTION_KEY sont
# absents ou laissés à leurs valeurs de développement.
# ============================================================================
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

# Réglable sans redéploiement : poser LOG_LEVEL_APP=DEBUG le temps d'une mise au point, puis
# retirer la variable. Le SQL reste à part — c'est le plus volumineux, et on ne l'allume que
# lorsqu'on cherche précisément une requête.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.coachrun: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAMS:WARN}

# Swagger/OpenAPI fermé en production : la spec expose toute la surface de l'API
# (routes, paramètres, schémas) à un visiteur anonyme. Réactivable ponctuellement
# via SWAGGER_ENABLED=true (puis remettre à false).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  seed:
    enabled: false
  registration:
    # Bêta ouverte, sur demande validée.
    #
    # Les deux régimes précédents échouaient pour des raisons opposées. « open » laissait
    # n'importe qui — robot compris — repartir avec un club et un compte propriétaire sur la seule
    # unicité de l'adresse. « invite » fermait la porte derrière un code partagé : il fallait le
    # distribuer à la main à chaque nouveau coach, il se transfère, et il ne dit jamais qui s'en
    # est servi. Avec dix nouveaux athlètes et leurs coachs qui arrivent, ni l'un ni l'autre ne
    # tient.
    #
    # « request » garde le formulaire ouvert à tous, mais il dépose une DEMANDE : rien n'est créé
    # avant qu'un administrateur ne tranche depuis /admin/club-requests, et la validation ouvre le
    # club et le compte en un geste. Les deux autres valeurs restent disponibles.
    mode: ${REGISTRATION_MODE:request}
