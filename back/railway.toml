# Config as code Railway pour coach-app (service backend, rootDirectory=/back).
# Les valeurs ci-dessous prennent le pas sur celles du dashboard Railway.

[build]
builder = "RAILPACK"

[deploy]
# Le context-path Spring est /api : /actuator/health seul renvoie 404.
healthcheckPath = "/api/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# 1 réplica en Europe (Amsterdam), comme en production aujourd'hui.
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1
